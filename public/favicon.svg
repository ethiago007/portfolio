<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Round dark background -->
  <rect x="0" y="0" width="100" height="100" rx="50" fill="#090908"/>

  <!-- Head: yellow circle with </> -->
  <circle cx="50" cy="26" r="16" fill="#e8ff47"/>
  <!-- < bracket -->
  <polyline points="41,21 36,26 41,31" fill="none" stroke="#090908" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- > bracket -->
  <polyline points="59,21 64,26 59,31" fill="none" stroke="#090908" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- / slash -->
  <line x1="53" y1="20" x2="47" y2="32" stroke="#090908" stroke-width="3" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="46" y="42" width="8" height="6" rx="1" fill="#1a1a18"/>

  <!-- Suit body -->
  <path d="M18,50 Q18,48 26,46 L40,50 L50,46 L60,50 L74,46 Q82,48 82,50 L84,94 Q84,96 82,96 L18,96 Q16,96 16,94 Z" fill="#1a1a18"/>

  <!-- Left lapel -->
  <path d="M40,50 L34,58 L42,70 L50,67 Z" fill="#e8ff47"/>
  <!-- Right lapel -->
  <path d="M60,50 L66,58 L58,70 L50,67 Z" fill="#e8ff47"/>

  <!-- Shirt/tie -->
  <path d="M50,67 L47,74 L50,94 L53,74 Z" fill="#f0ede6"/>

  <!-- Suit button -->
  <circle cx="50" cy="82" r="2.5" fill="#e8ff47"/>
</svg>
